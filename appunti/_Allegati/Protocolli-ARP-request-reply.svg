<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220">
 <style> text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#b8b8b8;text-anchor:middle;dominant-baseline:central} .t{font-size:14px} .ts{font-size:12px} .th{font-size:14px;font-weight:500} .r{fill:#e57373} .g{fill:#81c784} </style>
<defs>
 <marker id="arrow-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#e57373" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="arrow-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#81c784" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g fill="none" stroke="#b8b8b8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
 <!-- pannello 1: ARP request -->
 <rect x="45" y="110" width="50" height="40" rx="6"/>
 <rect x="125" y="110" width="50" height="40" rx="6"/>
 <rect x="205" y="110" width="50" height="40" rx="6"/>
 <rect x="285" y="110" width="50" height="40" rx="6"/>
 <line x1="30" y1="190" x2="350" y2="190"/>
 <line x1="70" y1="150" x2="70" y2="190"/>
 <line x1="150" y1="150" x2="150" y2="190"/>
 <line x1="230" y1="150" x2="230" y2="190"/>
 <line x1="310" y1="150" x2="310" y2="190"/>
 <g stroke="#e57373">
  <polyline points="70,110 70,70 310,70"/>
  <line x1="150" y1="70" x2="150" y2="106" marker-end="url(#arrow-r)"/>
  <line x1="230" y1="70" x2="230" y2="106" marker-end="url(#arrow-r)"/>
  <line x1="310" y1="70" x2="310" y2="106" marker-end="url(#arrow-r)"/>
 </g>
 <!-- pannello 2: ARP reply -->
 <rect x="445" y="110" width="50" height="40" rx="6"/>
 <rect x="525" y="110" width="50" height="40" rx="6"/>
 <rect x="605" y="110" width="50" height="40" rx="6"/>
 <rect x="685" y="110" width="50" height="40" rx="6"/>
 <line x1="430" y1="190" x2="750" y2="190"/>
 <line x1="470" y1="150" x2="470" y2="190"/>
 <line x1="550" y1="150" x2="550" y2="190"/>
 <line x1="630" y1="150" x2="630" y2="190"/>
 <line x1="710" y1="150" x2="710" y2="190"/>
 <polyline points="550,110 550,70 470,70 470,106" stroke="#81c784" marker-end="url(#arrow-g)"/>
</g>
<text class="th" x="190" y="24">ARP request (broadcast)</text>
<text class="ts r" x="190" y="52">“chi è l'host B?”</text>
<text class="t" x="70" y="130">A</text>
<text class="t" x="150" y="130">B</text>
<text class="t" x="230" y="130">C</text>
<text class="t" x="310" y="130">D</text>
<text class="th" x="590" y="24">ARP reply (diretta ad A)</text>
<text class="ts g" x="590" y="52">“sono io, ecco il mio indirizzo fisico”</text>
<text class="t" x="470" y="130">A</text>
<text class="t" x="550" y="130">B</text>
<text class="t" x="630" y="130">C</text>
<text class="t" x="710" y="130">D</text>
</svg>
